{% extends "base.html" %}
{% block title %}{{ "Edit lead" if lead else "Add lead" }}{% endblock %}
{% block page_heading %}{{ "Edit lead" if lead else "Add lead" }}{% endblock %}

{% block content %}

<section class="panel glass-2" style="max-width:720px">
  <div class="panel-head">
    <h2>{{ "Edit lead" if lead else "Add a lead" }}</h2>
  </div>

  <form method="POST"
        action="{{ url_for('edit_lead', lead_id=lead.id) if lead else url_for('new_lead') }}">

    <div class="field">
      <div class="field-label"><span>Lead type</span></div>
      <div class="seg" id="type-seg" style="width:auto;display:inline-flex">
        <button type="button" data-type="company" class="type-toggle-btn">Company lead</button>
        <button type="button" data-type="intent" class="type-toggle-btn">Intent lead</button>
      </div>
      <input type="hidden" name="lead_type" id="lead_type" value="{{ lead.lead_type if lead else lead_type }}">
    </div>

    <div class="form-field">
      <label class="form-label" for="status">Status</label>
      <select class="form-input" id="status" name="status">
        {% for s in statuses %}
          <option value="{{ s }}" {% if (lead.status if lead else 'new') == s %}selected{% endif %}>{{ status_labels[s] }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-field">
      <label class="form-label" for="score">Score (0-100)</label>
      <input class="form-input" type="number" min="0" max="100" id="score" name="score"
             value="{{ lead.score if lead and lead.score is not none else '' }}">
    </div>

    <div id="company-fields">
      <div class="form-field">
        <label class="form-label" for="company_name">Company name</label>
        <input class="form-input" type="text" id="company_name" name="company_name"
               value="{{ lead.company_name or '' if lead else '' }}">
      </div>
      <div class="form-field">
        <label class="form-label" for="industry">Industry</label>
        <input class="form-input" type="text" id="industry" name="industry"
               value="{{ lead.industry or '' if lead else '' }}">
      </div>
      <div class="form-field">
        <label class="form-label" for="services_needed">Services they might need</label>
        <input class="form-input" type="text" id="services_needed" name="services_needed"
               value="{{ lead.services_needed or '' if lead else '' }}">
      </div>
    </div>

    <div id="intent-fields">
      <div class="form-field">
        <label class="form-label" for="requested_service">Requested service</label>
        <input class="form-input" type="text" id="requested_service" name="requested_service"
               placeholder="e.g. Structural drawings, permit set…"
               value="{{ lead.requested_service or '' if lead else '' }}">
      </div>
      <div class="form-field">
        <label class="form-label" for="post_text">Post text / snippet</label>
        <textarea class="form-input" id="post_text" name="post_text" rows="3">{{ lead.post_text or '' if lead else '' }}</textarea>
      </div>
      <div class="form-field">
        <label class="form-label" for="post_url">Source / post URL</label>
        <input class="form-input" type="url" id="post_url" name="post_url"
               value="{{ lead.post_url or '' if lead else '' }}">
      </div>
      <div class="form-field">
        <label class="form-label" for="profile_url">Public profile / page URL</label>
        <input class="form-input" type="url" id="profile_url" name="profile_url"
               value="{{ lead.profile_url or '' if lead else '' }}">
      </div>
      <div class="form-field">
        <label class="form-label" for="potential_project_type">Potential project type</label>
        <input class="form-input" type="text" id="potential_project_type" name="potential_project_type"
               value="{{ lead.potential_project_type or '' if lead else '' }}">
      </div>
      <div class="form-field">
        <label class="form-label" for="potential_urgency">Potential urgency</label>
        <select class="form-input" id="potential_urgency" name="potential_urgency">
          <option value="">—</option>
          {% for level in ['low','medium','high'] %}
            <option value="{{ level }}" {% if lead and lead.potential_urgency == level %}selected{% endif %}>{{ level|capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-field">
        <label class="form-label" for="intent_classification">AI classification (manual for now)</label>
        <select class="form-input" id="intent_classification" name="intent_classification">
          <option value="">—</option>
          {% for level in ['High Intent','Medium Intent','Low Intent','Not a lead'] %}
            <option value="{{ level }}" {% if lead and lead.intent_classification == level %}selected{% endif %}>{{ level }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-field">
      <label class="form-label" for="contact_name">Contact name</label>
      <input class="form-input" type="text" id="contact_name" name="contact_name"
             value="{{ lead.contact_name or '' if lead else '' }}">
    </div>
    <div class="form-field">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" name="email"
             value="{{ lead.email or '' if lead else '' }}">
    </div>
    <div class="form-field">
      <label class="form-label" for="phone">Phone</label>
      <input class="form-input" type="text" id="phone" name="phone"
             value="{{ lead.phone or '' if lead else '' }}">
    </div>
    <div class="form-field">
      <label class="form-label" for="website">Website</label>
      <input class="form-input" type="url" id="website" name="website"
             value="{{ lead.website or '' if lead else '' }}">
    </div>

    <div class="form-field" style="display:flex;gap:var(--s-2)">
      <div style="flex:1">
        <label class="form-label" for="city">City</label>
        <input class="form-input" type="text" id="city" name="city"
               value="{{ lead.city or '' if lead else '' }}">
      </div>
      <div style="flex:1">
        <label class="form-label" for="state">State</label>
        <input class="form-input" type="text" id="state" name="state"
               value="{{ lead.state or '' if lead else '' }}">
      </div>
    </div>

    <div class="form-field">
      <label class="form-label" for="lead_source">Source</label>
      <input class="form-input" type="text" id="lead_source" name="lead_source"
             placeholder="Manual, Reddit, Referral…"
             value="{{ lead.lead_source or 'Manual' if lead else 'Manual' }}">
    </div>

    <div class="form-field">
      <label class="form-label" for="notes">Notes</label>
      <textarea class="form-input" id="notes" name="notes" rows="3">{{ lead.notes or '' if lead else '' }}</textarea>
    </div>

    <div style="display:flex;gap:var(--s-2)">
      <a class="btn" href="{{ url_for('lead_detail', lead_id=lead.id) if lead else url_for('all_leads') }}">Cancel</a>
      <button class="btn btn-primary" type="submit">{{ "Save changes" if lead else "Add lead" }}</button>
    </div>
  </form>
</section>

<script>
(function () {
  var typeInput = document.getElementById('lead_type');
  var buttons = document.querySelectorAll('.type-toggle-btn');
  var companyFields = document.getElementById('company-fields');
  var intentFields = document.getElementById('intent-fields');

  function setType(type) {
    typeInput.value = type;
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.type === type));
    });
    companyFields.style.display = (type === 'company') ? '' : 'none';
    intentFields.style.display = (type === 'intent') ? '' : 'none';
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { setType(b.dataset.type); });
  });

  setType(typeInput.value || 'company');
})();
</script>

{% endblock %}
