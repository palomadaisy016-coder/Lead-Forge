{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block page_heading %}{{ page_title }}{% endblock %}

{% block content %}
  <section class="panel glass-2">
    <div class="empty" style="padding:var(--s-6) var(--s-3)">
      <span class="empty-icon">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-{{ page_icon }}"></use></svg>
      </span>
      <strong>{{ page_title }}</strong>
      <p>{{ page_note }}</p>
      <a class="btn" href="/dashboard">Back to dashboard</a>
    </div>
  </section>
{% endblock %}
